{{- $users := list }}
{{- $attrs := dict }}
{{- if dig "testUser" "enabled" false .Values.keycloak.config }}
{{- $users = append $users "testuser" }}
{{- $_ := set $attrs "testuser" (dict "email" "testuser@test.local" "first" "Test" "last" "User" "roles" "SUPER_ADMIN STUDY_COORDINATOR RESEARCHER CRITERIA_EDITOR STUDY_APPROVER") }}
{{- end }}
{{- if dig "researchUser" "enabled" false .Values.keycloak.config }}
{{- $users = append $users "research" }}
{{- $_ := set $attrs "research" (dict "email" (dig "researchUser" "email" "research@ohs.local" .Values.keycloak.config) "first" "Research" "last" "User" "roles" "SUPER_ADMIN ORGANIZATION_ADMIN STUDY_COORDINATOR STUDY_APPROVER RESEARCHER CRITERIA_EDITOR CONTENT_ADMIN") }}
{{- end }}
{{- if and $users (index .Values "cohort-explorer-backend" "enabled") }}
---
# Post-install/-upgrade Job that makes sure the portal users (keycloak.config.testUser,
# keycloak.config.researchUser) exist in Keycloak AND are approved in num.user_details.
#
# It creates a missing user rather than failing on it. The realm import populates
# users only when the Keycloak database is empty, so on every cluster whose realm
# predates the current chart - the normal case for a long-lived environment - the
# user is simply absent and this Job used to abort, taking the whole helm upgrade
# with it. Creating it here converges the realm no matter how old it is.
# NUMportal does not auto-create users on first authenticated request - the row must
# exist and be approved before any authenticated API call succeeds. Existing rows are
# left alone (ON CONFLICT DO NOTHING), so approvals changed in the portal persist.
# Runs after numportal-schema-init (weight 5); waits for Flyway to create the table.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-numportal-user-seed
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-timeout: "900s"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app: numportal-user-seed
    release: {{ .Release.Name }}
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: numportal-user-seed
        release: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      # postgres:15-alpine is musl-based: with the default ndots:5, host search
      # domains (e.g. a corporate DNS suffix) are tried before the literal name,
      # and one SERVFAIL aborts musl's getaddrinfo - wget/psql then fail with
      # "bad address" although the cluster FQDN resolves. ndots:1 resolves any
      # dotted name absolutely first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: seed
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-numportal-user-secret
                  key: password
            - name: PG_HOST
              value: "postgres-cluster-rw.{{ .Release.Namespace }}.svc.cluster.local"
            - name: KC_URL
              value: "http://{{ .Release.Name }}-keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080"
            - name: KC_ADMIN_USER
              value: {{ .Values.keycloak.config.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ohs-credentials
                  key: keycloak-admin-password
            # Only read when the research user has to be created. Optional on
            # purpose: an empty value makes Keycloak assign a random password.
            - name: KC_RESEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ohs-credentials
                  key: keycloak-research-password
                  optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "==> Waiting for Keycloak..."
              until wget -q -O /dev/null "${KC_URL}/auth/realms/master/.well-known/openid-configuration" 2>/dev/null; do
                echo "    Keycloak not ready, retrying in 5s..."
                sleep 5
              done
              echo "    Keycloak ready."

              echo "==> Waiting for PostgreSQL..."
              until pg_isready -h "$PG_HOST" -U numportal -q; do sleep 3; done
              echo "    PostgreSQL ready."

              echo "==> Waiting for num.user_details table (Flyway migration in cohort-explorer-backend)..."
              until psql "postgresql://numportal@${PG_HOST}/numportal" -t -c \
                "SELECT 1 FROM information_schema.tables WHERE table_schema='num' AND table_name='user_details'" \
                2>/dev/null | grep -q 1; do
                echo "    Table not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "    Table ready."

              # Fetched only now: admin tokens of the master realm live 60 s by default,
              # and on a first install the waits above can take minutes (Flyway).
              echo "==> Fetching admin token..."
              TOKEN_JSON=$(wget -q -O - \
                --header="Content-Type: application/x-www-form-urlencoded" \
                --post-data="grant_type=password&client_id=admin-cli&username=${KC_ADMIN_USER}&password=${KC_ADMIN_PASSWORD}" \
                "${KC_URL}/auth/realms/master/protocol/openid-connect/token")
              ADMIN_TOKEN=$(echo "$TOKEN_JSON" | tr -d '\n\r' | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
              if [ -z "$ADMIN_TOKEN" ]; then
                echo "ERROR: failed to obtain admin token" >&2; exit 1
              fi
              echo "    Admin token obtained."

              KC_ADMIN_API="${KC_URL}/auth/admin/realms/crr"

              lookup_user() {
                wget -q -O - --header="Authorization: Bearer ${ADMIN_TOKEN}" \
                  "${KC_ADMIN_API}/users?username=$1&exact=true" 2>/dev/null \
                  | tr -d '\n\r' | grep -o '"id":"[0-9a-f-]*"' | head -1 | cut -d'"' -f4
              }

              for U in {{ join " " $users }}; do
                echo "==> Fetching ${U} UUID from Keycloak crr realm..."
                USER_ID=$(lookup_user "$U")

                if [ -z "$USER_ID" ]; then
                  # Attributes mirror the "users" block of the realm import in
                  # charts/keycloak/templates/configmap-realm.yaml - keep the two
                  # in step when the roles there change.
                  case "$U" in
{{- range $name, $a := $attrs }}
                    {{ $name }})
                      U_EMAIL="{{ $a.email }}"; U_FIRST="{{ $a.first }}"
                      U_LAST="{{ $a.last }}"; U_ROLES="{{ $a.roles }}"
                      ;;
{{- end }}
                    *) echo "ERROR: no attributes known for user ${U}" >&2; exit 1 ;;
                  esac

                  # The password rides along in the creation call. This image is
                  # postgres:15-alpine, whose wget is BusyBox: it speaks GET and
                  # --post-data and nothing else, so the usual PUT to
                  # /users/{id}/reset-password is simply not available here, and
                  # there is no curl either. Keycloak accepts a credentials array
                  # on user creation, which needs no second request.
                  # An empty password is deliberate for the research user: Keycloak
                  # then assigns a random one, to be reset in the admin console.
                  U_PASS=""
                  [ "$U" = "testuser" ] && U_PASS="test123"
                  [ "$U" = "research" ] && U_PASS="${KC_RESEARCH_PASSWORD:-}"
                  U_CRED=""
                  if [ -n "$U_PASS" ]; then
                    U_CRED=",\"credentials\":[{\"type\":\"password\",\"value\":\"${U_PASS}\",\"temporary\":false}]"
                  fi

                  echo "    ${U} absent (realm predates this chart) - creating it..."
                  wget -q -O /dev/null --header="Authorization: Bearer ${ADMIN_TOKEN}" \
                    --header="Content-Type: application/json" \
                    --post-data="{\"username\":\"${U}\",\"enabled\":true,\"emailVerified\":true,\"email\":\"${U_EMAIL}\",\"firstName\":\"${U_FIRST}\",\"lastName\":\"${U_LAST}\"${U_CRED}}" \
                    "${KC_ADMIN_API}/users" || true

                  USER_ID=$(lookup_user "$U")
                  if [ -z "$USER_ID" ]; then
                    echo "ERROR: could not create ${U} in the crr realm" >&2
                    exit 1
                  fi

                  # Roles carry the portal's authorisation. A user without them can
                  # log in but sees nothing, which is harder to diagnose than a
                  # missing user, so a role that cannot be found is reported.
                  for R in $U_ROLES; do
                    ROLE_ID=$(wget -q -O - --header="Authorization: Bearer ${ADMIN_TOKEN}" \
                      "${KC_ADMIN_API}/roles/${R}" 2>/dev/null | tr -d '\n\r' \
                      | grep -o '"id":"[0-9a-f-]*"' | head -1 | cut -d'"' -f4)
                    if [ -z "$ROLE_ID" ]; then
                      echo "    WARNING: realm role ${R} does not exist - skipped" >&2
                      continue
                    fi
                    wget -q -O /dev/null --header="Authorization: Bearer ${ADMIN_TOKEN}" \
                      --header="Content-Type: application/json" \
                      --post-data="[{\"id\":\"${ROLE_ID}\",\"name\":\"${R}\"}]" \
                      "${KC_ADMIN_API}/users/${USER_ID}/role-mappings/realm" || true
                  done
                  echo "    ${U} created with roles: ${U_ROLES}"
                fi
                echo "    ${U} UUID: ${USER_ID}"

                echo "==> Approving ${U} in num.user_details..."
                psql "postgresql://numportal@${PG_HOST}/numportal" -c \
                  "INSERT INTO num.user_details (user_id, approved, created_date)
                   VALUES ('${USER_ID}', true, CURRENT_DATE)
                   ON CONFLICT (user_id) DO NOTHING;"
              done

              echo "==> user seed complete."
{{- end }}
