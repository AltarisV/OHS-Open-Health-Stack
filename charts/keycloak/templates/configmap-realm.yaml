{{- if .Values.config.realmImport.enabled }}
{{- $host := .Values.config.hostname | default "localhost" }}
# ConfigMap holding the crr realm definition for automatic import on first startup.
# Keycloak reads files from /opt/keycloak/data/import/ when started with --import-realm.
# If the realm already exists (e.g. after a helm upgrade), Keycloak skips the import - it is idempotent.
#
# Placeholders, replaced at pod start by the realm-config initContainer (deployment.yaml):
#   __NUM_PORTAL_CLIENT_SECRET__  <- ohs-credentials/numportal-keycloak-secret
#   __RESEARCH_USER_PASSWORD__    <- ohs-credentials/keycloak-research-password
#                                    (optional; a random password if missing or empty)
#
# Redirect URIs of num-portal-webapp follow config.hostname: "*" for localhost (local
# development), otherwise the external host plus http://localhost - the values the cloud
# deployment was given by hand in the admin console before they were kept here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  crr-realm.json: |
    {
      "realm": "crr",
      "enabled": true,
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "roles": {
        "realm": [
          { "name": "SUPER_ADMIN",         "composite": false },
          { "name": "ORGANIZATION_ADMIN",   "composite": false },
          { "name": "RESEARCHER",           "composite": false },
          { "name": "STUDY_COORDINATOR",    "composite": false },
          { "name": "STUDY_APPROVER",       "composite": false },
          { "name": "CRITERIA_EDITOR",      "composite": false },
          { "name": "CONTENT_ADMIN",        "composite": false }
        ]
      },
      "clients": [
        {
          "clientId": "num-portal",
          "name": "NUM Portal Backend",
          "description": "Confidential client used by cohort-explorer-backend for service accounts and direct access grants",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "__NUM_PORTAL_CLIENT_SECRET__",
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "protocol": "openid-connect"
        },
        {
          "clientId": "num-portal-webapp",
          "name": "NUM Portal Frontend",
          "description": "Public client used by the cohort-explorer-frontend Angular SPA",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          {{- if eq $host "localhost" }}
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          {{- else }}
          "redirectUris": ["https://{{ $host }}/*", "http://localhost/*"],
          "webOrigins": ["https://{{ $host }}", "http://localhost"],
          {{- end }}
          "protocol": "openid-connect",
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "groups",
                "jsonType.label": "String"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "service-account-num-portal",
          "enabled": true,
          "serviceAccountClientId": "num-portal",
          "clientRoles": {
            "realm-management": [
              "view-users",
              "manage-users",
              "view-realm",
              "query-users"
            ]
          }
        }
        {{- if .Values.config.testUser.enabled }},
        {
          "username": "testuser",
          "enabled": true,
          "emailVerified": true,
          "email": "testuser@test.local",
          "firstName": "Test",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "test123",
              "temporary": false
            }
          ],
          "realmRoles": ["SUPER_ADMIN", "STUDY_COORDINATOR", "RESEARCHER", "CRITERIA_EDITOR", "STUDY_APPROVER"]
        }
        {{- end }}
        {{- if .Values.config.researchUser.enabled }},
        {
          "username": "research",
          "enabled": true,
          "emailVerified": true,
          "email": {{ .Values.config.researchUser.email | quote }},
          "firstName": "Research",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "__RESEARCH_USER_PASSWORD__",
              "temporary": false
            }
          ],
          "realmRoles": ["SUPER_ADMIN", "ORGANIZATION_ADMIN", "STUDY_COORDINATOR", "STUDY_APPROVER", "RESEARCHER", "CRITERIA_EDITOR", "CONTENT_ADMIN"]
        }
        {{- end }}
      ]
    }
{{- end }}
