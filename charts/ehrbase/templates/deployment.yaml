apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ehrbase.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ehrbase.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ehrbase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ehrbase.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.startupDependencies.postgres.enabled }}
      initContainers:
      - name: wait-for-postgres
        image: {{ .Values.startupDependencies.postgres.image | quote }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          until pg_isready -h {{ .Values.config.database.host | quote }} -p {{ .Values.config.database.port }} -U {{ .Values.config.database.username | quote }} -q; do
            echo "Waiting for PostgreSQL at {{ .Values.config.database.host }}:{{ .Values.config.database.port }}..."
            sleep 3
          done
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        
        env:
        # Authentication configuration
        - name: SECURITY_AUTHUSER
          value: {{ .Values.config.auth.username | quote }}
        - name: SECURITY_AUTHPASSWORD
          valueFrom:
            secretKeyRef:
              name: ohs-credentials
              key: ehrbase-user-password
        - name: SECURITY_AUTHTYPE
          value: {{ .Values.config.auth.type | quote }}
        
        # Database configuration
        - name: DB_URL
          value: "jdbc:postgresql://{{ .Values.config.database.host }}:{{ .Values.config.database.port }}/{{ .Values.config.database.name }}"
        - name: DB_USER_ADMIN
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: username
        - name: DB_PASS_ADMIN
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: password
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: password

        {{- with .Values.config.database.pool }}
        # Verbindungspool (HikariCP). Ohne keepaliveTime prueft der Pool
        # leerlaufende Verbindungen nie. Eine vom Cluster-Netz stillgelegte
        # Verbindung wird dann weiter ausgegeben und scheitert erst beim
        # Benutzen mit SQLSTATE 08006; der Pool erholt sich davon nicht von
        # selbst. Am 2026-09-05 hat genau das ein Replikat stillgelegt, ohne
        # dass Liveness oder Readiness es bemerkt haetten - siehe M-63.
        {{- if .keepaliveTime }}
        - name: SPRING_DATASOURCE_HIKARI_KEEPALIVETIME
          value: {{ .keepaliveTime | quote }}
        {{- end }}
        {{- if .maxLifetime }}
        - name: SPRING_DATASOURCE_HIKARI_MAXLIFETIME
          value: {{ .maxLifetime | quote }}
        {{- end }}
        {{- if .maximumPoolSize }}
        - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
          value: {{ .maximumPoolSize | quote }}
        {{- end }}
        {{- end }}

        {{- with .Values.config.management }}
        # Management-Endpunkte. EHRbase liefert sie vollstaendig abgeschaltet
        # aus (endpoints.access.default und endpoint.health.access auf none,
        # endpoints.web.access auf ADMIN_ONLY) - daher im Log die Zeile
        # "Exposing 0 endpoints beneath base path '/management'". Erst diese
        # Werte machen /ehrbase/management/health fuer einen Probe erreichbar.
        {{- if .healthAccess }}
        - name: MANAGEMENT_ENDPOINT_HEALTH_ACCESS
          value: {{ .healthAccess | quote }}
        {{- end }}
        {{- if .webAccess }}
        - name: MANAGEMENT_ENDPOINTS_WEB_ACCESS
          value: {{ .webAccess | quote }}
        {{- end }}
        {{- if .probesEnabled }}
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: "true"
        {{- end }}
        {{- if .readinessInclude }}
        # Die Readiness-Gruppe von Spring Boot enthaelt ab Werk NUR
        # readinessState, also den Lebenszyklus der Anwendung. Ohne "db" darin
        # pruefte auch ein HTTP-Probe die Datenbank nicht und waere genauso
        # blind wie der tcpSocket-Probe, den er ersetzt.
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: {{ .readinessInclude | quote }}
        {{- end }}
        {{- end }}

        # Java/JVM configuration
        - name: JAVA_OPTS
          value: "-Xmx{{ .Values.config.jvm.maxHeapSize }} -Xms{{ .Values.config.jvm.minHeapSize }} -XX:+UseG1GC"
        
        # AQL result limits. Unset by default in EHRbase, which means an AQL
        # query without a LIMIT streams every matching row into the JVM heap -
        # on a large repository that ends in OutOfMemoryError and takes the
        # whole server down for every other client, not just the caller.
        {{- with .Values.config.aql }}
        {{- if .defaultLimit }}
        - name: EHRBASE_REST_AQL_DEFAULTLIMIT
          value: {{ .defaultLimit | quote }}
        {{- end }}
        {{- if .maxLimit }}
        - name: EHRBASE_REST_AQL_MAXLIMIT
          value: {{ .maxLimit | quote }}
        {{- end }}
        {{- if .maxFetch }}
        - name: EHRBASE_REST_AQL_MAXFETCH
          value: {{ .maxFetch | quote }}
        {{- end }}
        {{- if .fetchPrecedence }}
        - name: EHRBASE_REST_AQL_FETCHPRECEDENCE
          value: {{ .fetchPrecedence | quote }}
        {{- end }}
        {{- if .debuggingEnabled }}
        - name: EHRBASE_REST_AQL_DEBUGGINGENABLED
          value: "true"
        {{- end }}
        {{- end }}

        # Logging configuration
        - name: LOGGING_LEVEL_ROOT
          value: {{ .Values.config.logging.level | quote }}
        
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
        {{- end }}
        
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ehrbase.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ehrbase.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ehrbase.selectorLabels" . | nindent 4 }}
