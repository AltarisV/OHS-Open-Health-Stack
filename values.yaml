# Open Health Stack - Master Helm Values
# This file controls the deployment of all components in the OHS platform.
# All external endpoints, credentials, and resource limits should be customized here.

# Global configuration shared across all subcharts
global:
  domain: "example.org"  # CHANGE_ME: your actual domain
  environment: "development"  # Options: development, staging, production
  timezone: "UTC"
  
  # Shared image pull policy
  imagePullPolicy: "IfNotPresent"  # Options: Always, IfNotPresent, Never
  
  # Intended baseline pod security context. NOTE: not currently wired into the
  # subchart templates - actual enforcement is the per-workload securityContext
  # in each chart's values (all workloads run non-root). Kept as the declared intent.
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 1000

# Database Operators
cloudnative-pg:
  enabled: true
  # Informational only: the operators are installed outside this chart
  # (docs/GETTING_STARTED.md). Versions as tested.
  version: "0.29.0"  # PIN_VERSION: Helm chart cnpg/cloudnative-pg (operator 1.30.0)
  cnpg:
    crds:
      create: true

mongodb-operator:
  enabled: true
  version: "0.13.0"  # PIN_VERSION: Helm chart mongodb/community-operator (informational)

# PostgreSQL Clusters (for EHRbase and Eos)
postgres:
  enabled: true
  # EHRbase database cluster
  ehrbase:
    enabled: true
    # Sized from a measured migration, not a guess: 4.7M openEHR compositions
    # from the SAP IS-H/i.s.h.med dataset occupy 298 GB (measured 2026-08-24 on
    # the reference instance, pg_database_size). ~64 KB per composition - the
    # canonical JSON plus the raw source row kept in feeder_audit dominate.
    # 400Gi leaves headroom for VACUUM, reindex and temp files.
    #
    # The previous value was the template default (10Gi, CHANGE_ME). It filled
    # up 208k compositions into the load, PostgreSQL PANICked on a checkpoint
    # it could not write, and every service on this cluster went down with it -
    # keycloak, numportal and eos_omop share the instance.
    # 400Gi data + 50Gi WAL, but in ONE volume - see walStorage below.
    storage: "450Gi"
    # Empty on purpose: pg_wal lives inside the data volume. This project's
    # Cinder quota caps the *number* of volumes at 20, and all 20 are in use;
    # a separate WAL volume would double what this cluster needs and could not
    # be provisioned at all (ProvisioningFailed, VolumeLimitExceeded, 2026-08-24).
    # Set this to e.g. "50Gi" once volume count is no longer the constraint.
    walStorage: ""
    # One instance, not three. Three would need six PVCs (data + WAL each) and
    # the project's Cinder *volume count* quota is 20 with 19 in use - instances
    # 2 and 3 were never created, the operator kept retrying unnoticed. Raising
    # this needs more volume count, not more storage.
    instances: 1
    backupRetention: "30d"
    primaryUpdateStrategy: "unsupervised"  # Options: unsupervised, rollingUpdate

    # Am 26.08.2026 wurde dieser Pod fuenfmal OOMKilled (Exit 137), zuletzt
    # mitten im Datenabruf des Cohort Explorers. Das Limit stand auf 1 GiB -
    # fuer eine Datenbank mit 4,79 Mio. Compositions, die zugleich EHRbase,
    # num-portal, Keycloak und Eos bedient. Weil es eine Einzelinstanz ist,
    # reisst jeder Neustart alles mit: EHRbase antwortet mit 500, num-portal
    # verliert schlagartig jede Verbindung, und im Portal steht nur "Die Daten
    # konnten nicht geladen werden".
    #
    # Die Nodes haben je rund 15,6 GiB und sind zu einem Viertel belegt.
    #
    # Am 2026-09-05 gemessen: dieselbe Zaehlung ueber alle 4,79 Mio.
    # Compositions braucht 31,2 s im ersten und 0,67 s in jedem weiteren Lauf
    # (M-63). Der Faktor 46 ist der Buffer-Cache - bei 298 GB Bestand und 2 GB
    # shared_buffers liest die Instanz fast jede neue Abfrage von der Platte.
    # Die Nodes haben je rund 15,6 GiB und sind zu einem Viertel belegt, das
    # Limit war also nicht die Grenze, sondern eine Vorsichtsmassnahme aus der
    # OOM-Woche. 12 GiB lassen shared_buffers verdreifachen und behalten rund
    # 4 GiB Abstand fuer work_mem, Verbindungen und Wartungsvorgaenge.
    #
    # Der Request muss mindestens so gross sein wie shared_buffers - CNPG
    # prueft das im Admission-Webhook und lehnt sonst ab ("Memory request is
    # lower than PostgreSQL `shared_buffers` value"). Der Request ist damit
    # keine Schaetzung mehr, sondern eine Ableitung: shared_buffers plus Luft
    # fuer Verbindungen, work_mem und Wartungsvorgaenge.
    resources:
      requests:
        memory: "5Gi"
        cpu: "500m"
      limits:
        memory: "12Gi"
        cpu: "2000m"

    # Abgestimmt auf das Limit oben. shared_buffers = 25 % des Containers,
    # effective_cache_size als Schaetzung dessen, was Container plus Seitencache
    # halten koennen. work_mem gilt PRO Sortier- und Hash-Schritt und
    # Verbindung, nicht pro Abfrage - bei max_connections 200 verbietet sich ein
    # grosszuegiger Wert von selbst, sonst ist der naechste OOM nur eine Frage
    # der Gleichzeitigkeit. Aenderungen an shared_buffers erfordern einen
    # Neustart der Instanz, den CNPG selbst durchfuehrt.
    parameters:
      max_connections: "200"
      shared_buffers: "4GB"
      effective_cache_size: "9GB"
      maintenance_work_mem: "512MB"
      # Bleibt bei 16 MB. work_mem gilt pro Sortier- und Hash-Schritt und pro
      # Verbindung; es mit dem Limit mitwachsen zu lassen holt den OOM vom
      # 26.08. zurueck, sobald mehrere Abfragen zusammentreffen.
      work_mem: "16MB"
      # 2 -> 4. Die teuren Abfragen sind Scans ueber Millionen Zeilen, und die
      # gewinnen linear an Arbeitern. Der Preis ist ein Vielfaches von work_mem
      # je Abfrage, was das erhoehte Speicherlimit oben traegt.
      max_parallel_workers_per_gather: "4"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"

    # Messen statt vermuten: pg_stat_statements sammelt Laufzeit und
    # Puffertreffer je erzeugtem SQL. Ohne das ist nicht feststellbar, welche
    # der vom Cohort Explorer gestellten AQL-Abfragen wirklich teuer ist - eine
    # Zaehlung von Hand misst nicht dasselbe wie die Abfragen im Betrieb.
    #
    # ACHTUNG: Aendern erzwingt einen Neustart der Instanz, und die ist eine
    # Einzelinstanz fuer EHRbase, num-portal, Keycloak und Eos zugleich. Der
    # Neustart reisst alle vier mit. Zusammen mit shared_buffers oben also in
    # EINEM Fenster ausrollen, nicht nacheinander.
    #
    # Nach dem Neustart einmalig in der Datenbank ehrbase:
    #   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    sharedPreloadLibraries: []   # zum Aktivieren: ["pg_stat_statements"]
  
  # Eos (OMOP Bridge) database cluster - can share with EHRbase or be separate
  eos:
    enabled: true
    sharedCluster: true  # true = use same cluster as EHRbase, false = create separate cluster
    # NOTE: while sharedCluster is true, the four settings below have NO effect -
    # the shared cluster is sized entirely by postgres.ehrbase.*. Kept here so
    # they are ready if eos is ever split into its own cluster.
    storage: "50Gi"  # CHANGE_ME: OMOP CDM requires more space; PIN_VERSION for production
    walStorage: "5Gi"
    instances: 2
    # Role password is injected via the postgres-eos-user-secret (set EOS_DB_PASSWORD in .env, applied by create-secret.sh).

  # Cohort Explorer Backend database (numportal schema, shared postgres-cluster)
  numportal:
    enabled: true
    # Role password is injected via the postgres-numportal-user-secret (set NUMPORTAL_DB_PASSWORD in .env).

  # Keycloak database (shared postgres-cluster)
  keycloak:
    enabled: true
    # Role password is injected via the postgres-keycloak-user-secret (set KEYCLOAK_DB_PASSWORD in .env).

  # Backup (disabled by default). For production, enable and point at an
  # S3-compatible object store. CNPG needs credentials in a Kubernetes Secret
  # with keys ACCESS_KEY_ID and ACCESS_SECRET_KEY (override key names below).
  backup:
    enabled: false
    destinationPath: ""  # e.g. s3://my-bucket/postgres-backups  CHANGE_ME
    retentionDays: 30
    # endpointURL: "https://s3.internal.example.org"  # for non-AWS / internal MinIO
    # s3Credentials:
    #   secretName: "postgres-backup-s3"   # kubectl create secret generic postgres-backup-s3 ...
    #   accessKeyIdKey: "ACCESS_KEY_ID"
    #   secretAccessKeyKey: "ACCESS_SECRET_KEY"

# MongoDB Clusters (for openFHIR)
mongodb:
  enabled: true
  openfhir:
    enabled: true
    storage: "20Gi"  # CHANGE_ME
    replicas: 3
    # Root password is injected via the mongodb-root-password secret (set MONGODB_ROOT_PASSWORD in .env).
    # openfhir user password is injected via the mongodb-openfhir-password secret (set OPENFHIR_MONGO_PASSWORD in .env).
    persistence:
      enabled: true

# ========== CORE FOSS COMPONENTS ==========

# EHRbase - EHR storage (published Docker image: ehrbase/ehrbase)
ehrbase:
  enabled: true
  replicaCount: 2
  image:
    repository: "ehrbase/ehrbase"
    tag: "2.31.0"  # PIN_VERSION: check https://hub.docker.com/r/ehrbase/ehrbase/tags for latest
    pullPolicy: "IfNotPresent"
  
  service:
    type: "ClusterIP"
    port: 8080
    targetPort: 8080
  
  ingress:
    enabled: true
    path: "/ehrbase"
    pathType: "Prefix"

  # Sized for a repository in the millions of compositions. Der Heap bleibt
  # bewusst 2 GiB unter dem Container-Limit: die JVM braucht diesen Abstand fuer
  # Metaspace, Code-Cache und direkte Puffer, und ein OOM-gekillter Container
  # reisst jede laufende Anfrage mit, nicht nur die verursachende.
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "6Gi"

  # Application config. These keys MUST live under `config:` - that is the schema the
  # ehrbase subchart reads (.Values.config.*). Keys placed directly under `ehrbase:` are ignored.
  config:
    # Security: basic auth credentials.
    # Password is injected via the ohs-credentials secret, key ehrbase-user-password
    # (set EHRBASE_USER_PASSWORD in .env, applied by create-secret.sh).
    auth:
      enabled: true
      username: "ehrbase_user"
      type: "BASIC"  # Options: BASIC, OAUTH2

    # JVM-Heap. Muss zu resources.limits.memory passen (2 GiB Abstand).
    jvm:
      maxHeapSize: "4g"
      minHeapSize: "1g"

    # Schutz vor unbegrenzten AQL-Abfragen. Am 26.08.2026 hat die Startseite von
    # openEHRTool eine Abfrage ohne LIMIT ueber ~2 Mio. Compositions gestellt;
    # EHRbase quittierte das mit OutOfMemoryError - der trifft den gesamten
    # Dienst, also auch den Cohort Explorer.
    #
    # ACHTUNG: defaultLimit kuerzt STILL, ohne Fehler und ohne Hinweis in der
    # Antwort. Die Untergrenze fuer einen brauchbaren Wert ist deshalb die
    # Patientenzahl: eine Kohortenabfrage mit SELECT DISTINCT e/ehr_id/value
    # liefert hoechstens eine Zeile je Patient, und davon gibt es (Messung
    # 26.08.2026) 104.840. Ein Limit darunter wuerde Kohorten unbemerkt
    # abschneiden. 200.000 laesst Luft fuer Wachstum und bleibt fuer
    # ID-Ergebnisse winzig - EHR-IDs sind ein paar Dutzend Byte pro Zeile.
    #
    # Gemessene Compositions je Template (26.08.2026, gesamt ~4,79 Mio.):
    #   KDS_Laborbericht 2.040.085 | Vitalparameter 1.253.772
    #   Patientenaufenthalt_ISH 945.056 | KDS_Fall_ISH 147.156
    #   KDS_Diagnose_ISH 147.154 | KDS_Prozedur_ISH 130.347
    #   KDS_Person_Pseudonymisiert 104.840 | KDS_Medikationseintrag_ISH 25.108
    #   Allergieliste_ISH 686
    aql:
      defaultLimit: "200000"
      maxLimit: ""
      maxFetch: ""
      fetchPrecedence: ""

    # Database connection - CloudNativePG read-write service in this namespace.
    # Credentials are injected via the postgres-cluster-app secret
    # (set EHRBASE_DB_PASSWORD in .env, applied by create-secret.sh).
    database:
      host: "postgres-cluster-rw.ohs.svc.cluster.local"  # CHANGE_ME: update namespace if not 'ohs'
      port: 5432
      name: "ehrbase"
      username: "ehrbase"

  # Probes: intentionally none here. They come from charts/ehrbase/values.yaml -
  # liveness tcpSocket, readiness httpGet on /ehrbase/management/health/readiness
  # including the database (M-63). A handler set here is merged with the subchart's
  # into a probe with two handlers, which the API server rejects.

# openFHIR - FHIR server & EHR-FHIR mapping (published Docker image: openfhir/openfhir)
openfhir:
  enabled: true
  replicaCount: 2
  image:
    repository: "openfhir/openfhir"
    tag: "2.2.1"  # PIN_VERSION: check Docker Hub for latest
    pullPolicy: "IfNotPresent"
  
  service:
    type: "ClusterIP"
    port: 8080
    targetPort: 8080
  
  ingress:
    enabled: true
    path: "/openfhir"
    pathType: "Prefix"
  
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  # Application config. These keys MUST live under `config:` - that is the schema the
  # openfhir subchart reads (.Values.config.*). Keys placed directly under `openfhir:` are ignored.
  config:
    # FHIR server configuration
    fhir:
      versions: ["STU3", "R4", "R4B"]  # Supported FHIR versions

    # EHRbase integration (for bidirectional sync).
    # The MongoDB connection URI and the EHRbase password are injected at runtime via the
    # ohs-credentials secret (keys openfhir-mongo-uri / ehrbase-user-password).
    ehrbase:
      enabled: true
      baseUrl: "http://ohs-ehrbase.ohs.svc.cluster.local:8080/ehrbase"  # CHANGE_ME: update namespace if not 'ohs'
      username: "ehrbase_user"

  livenessProbe:
    httpGet:
      path: "/health"
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10

# Eos - OMOP Bridge (published Docker image: ghcr.io/sevkohler/eos)
# Image is only tagged as 'latest' in the upstream registry; pin by digest for production.
# Workflow: https://github.com/SevKohler/Eos/blob/main/.github/workflows/docker-image.yml
eos:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/sevkohler/eos"
    tag: "latest"  # upstream only publishes 'latest'
    # Pinned by digest for production immutability (overrides tag when set).
    # Refresh: docker buildx imagetools inspect ghcr.io/sevkohler/eos:latest
    digest: "sha256:e92baaa035fadb942c57dc7be30de117905ec451fa317d189fc322cc2c3bbd33"
    pullPolicy: "IfNotPresent"
  
  service:
    type: "ClusterIP"
    port: 8081
    targetPort: 8081
  
  ingress:
    enabled: true
    path: "/eos"
    pathType: "Prefix"
  
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # Application config. These keys MUST live under `config:` - that is the schema the
  # eos subchart reads (.Values.config.*). Keys placed directly under `eos:` are ignored.
  config:
    # Database connection - separate OMOP schema/database on the shared PostgreSQL cluster.
    # Password is injected via the postgres-eos-user-secret (set EOS_DB_PASSWORD in .env).
    database:
      host: "postgres-cluster-rw.ohs.svc.cluster.local"  # CHANGE_ME: update namespace if not 'ohs'
      port: 5432
      name: "eos_omop"  # OMOP CDM schema here
      username: "eos"

    # EHRbase integration.
    # Password is injected via the ohs-credentials secret, key ehrbase-user-password.
    ehrbase:
      enabled: true
      baseUrl: "http://ohs-ehrbase.ohs.svc.cluster.local:8080/ehrbase/"  # CHANGE_ME: update namespace if not 'ohs'
      username: "ehrbase_user"

    # OMOP vocabularies and concept-mapping files.
    # NOTE: athenaVocabulariesPresent is informational only. Upstream Eos has NO runtime
    # toggle for it (verified against its application.yml + source) - Eos reads the OMOP
    # vocabulary tables straight from the DB. The real requirement is to load the ATHENA
    # vocabularies into eos_omop (use load-vocab.sh) and restart the Eos pod so it picks
    # them up. This key has no effect on the container; it just documents the DB state.
    omop:
      athenaVocabulariesPresent: false  # documentation flag only - see note above
      mappingFilesPath: "/app/mappings"  # ConfigMap-mounted path read by Eos

  livenessProbe:
    tcpSocket:
      port: 8081  # eos listens on 8081, not 8080
    initialDelaySeconds: 30
    periodSeconds: 10

# ========== EHRSUCTION ==========
# EHRsuction exports openEHR compositions from EHRbase to a persistent volume.
# Deployed as a Kubernetes CronJob. No published image - build with build-images.sh
# (component: ehrsuction) and push to your registry.
ehrsuction:
  enabled: true
  image:
    repository: "CHANGE_ME_REGISTRY/ehrsuction"  # CHANGE_ME: your registry/image
    tag: "ohs"
    pullPolicy: "IfNotPresent"
  schedule: "0 3 * * *"   # daily at 03:00
  suspend: true           # set false to enable scheduled runs
  backoffLimit: 1
  config:
    # Server root WITHOUT /ehrbase: EHRsuction appends /ehrbase/rest/openehr/v1 itself.
    # With /ehrbase here every request went to /ehrbase/ehrbase/... and got a 404.
    baseUrl: "http://ohs-ehrbase:8080"  # CHANGE_ME: update service name/namespace if different
    platform: "EHRBASE"
    exportType: "CANONICAL"
    steps: 5000
    # Export only compositions of this template (empty = all, the upstream behaviour).
    # A full export of a large repository does not fit a small export volume.
    templateId: ""
    logging:
      cmdLevel: "info"
      fileLevel: "debug"
  auth:
    username: "ehrbase_user"
    passwordSecret:
      name: "ohs-credentials"
      key: "ehrbase-user-password"
  output:
    persistence:
      enabled: true
      storage: "5Gi"  # CHANGE_ME: adjust for expected export volume
      accessMode: ReadWriteOnce

# ========== COHORT EXPLORER ==========
# Cohort Explorer is a web app to explore/visualize cohorts via openEHR.
# Base profile enables it as part of the standard stack.
# Before installing, make sure the image locations and external URLs below match your environment:
#   1. Build & push Docker images:
#        git clone https://github.com/highmed/cohort-explorer-backend && cd cohort-explorer-backend
#        docker build -t <your-registry>/cohort-explorer-backend:develop .
#        git clone https://github.com/highmed/cohort-explorer-frontend && cd cohort-explorer-frontend
#        docker build --build-arg ENVIRONMENT=deploy -t <your-registry>/cohort-explorer-frontend:develop .
#   2. Add secrets to ohs-credentials:
#        numportal-db-password, numportal-keycloak-secret, numportal-pseudonymity-secret,
#        ehrbase-admin-password, keycloak-admin-password, keycloak-db-password

# Cohort Explorer – Backend (Spring Boot, port 8090)
cohort-explorer-backend:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/highmed/cohort-explorer-backend"  # CHANGE_ME: your registry/image
    tag: "develop"
    pullPolicy: "IfNotPresent"

  service:
    type: "ClusterIP"
    port: 8090
    targetPort: 8090

  ingress:
    enabled: true
    path: "/num-portal"
    pathType: "Prefix"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  config:
    database:
      host: "postgres-cluster-rw.ohs.svc.cluster.local"
      port: 5432
      name: "numportal"
      schema: "num"
      username: "numportal"
      password: "CHANGE_ME"  # overridden by ohs-credentials secret
      # Ein Datenabruf haelt seine Verbindung ueber die gesamte Laufzeit. Bei
      # Hikaris Vorgabe von zehn genuegen wenige gleichzeitige Abrufe, um das
      # ganze Portal lahmzulegen - auch Navigation und Kacheln scheitern dann.
      # Postgres steht auf max_connections 200, 30 sind davon unkritisch.
      maxPoolSize: 30

    keycloak:
      url: "http://ohs-keycloak.ohs.svc.cluster.local:8080/auth"
      realm: "crr"
      clientId: "num-portal"
      clientSecret: "CHANGE_ME"  # overridden by ohs-credentials secret

    ehrbase:
      restApiUrl: "http://ohs-ehrbase.ohs.svc.cluster.local:8080/ehrbase/"  # CHANGE_ME
      username: "ehrbase_user"
      password: "CHANGE_ME"  # overridden by ohs-credentials secret
      adminUsername: "ehrbase-admin"
      adminPassword: "CHANGE_ME"  # overridden by ohs-credentials secret

    numUrl: "https://ohs.example.org"  # CHANGE_ME: your external URL
    # Restrict to the frontend origin(s). Comma-separated for multiple.
    corsAllowedOrigins: "https://ohs.example.org"  # CHANGE_ME: your frontend origin

    privacy:
      minHits: 30
      pseudonymitySecret: "CHANGE_ME"  # overridden by ohs-credentials secret
      # Pseudonyme lokal bilden statt bei einer Treuhandstelle anzufragen.
      # Ohne das schlaegt jeder Datenabruf fehl, und zwar lautlos: die leere
      # Tabelle in der Oberflaeche ist eine verschluckte ResourceNotFound.
      localPseudonyms: true

    mail:
      enabled: false
      host: "smtp.example.org"
      port: 587
      username: ""
      password: ""
      from: ""

    virusScan:
      enabled: false
      host: "localhost"
      port: 3310

    features:
      searchByManager: "false"
      handleUser: "true"
      workingWithAql: "true"
      cohortExplorer: "true"
      handleContent: "true"
      handleUserMessages: "true"
      handleOrganization: "true"
      handleProject: "true"

# Cohort Explorer – Frontend (Angular/nginx, port 80)
cohort-explorer-frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/highmed/cohort-explorer-frontend"  # CHANGE_ME: your registry/image
    tag: "develop"
    pullPolicy: "IfNotPresent"

  service:
    type: "ClusterIP"
    port: 80
    targetPort: 8080  # built image runs nginx-unprivileged (build-images.sh) listening on 8080

  ingress:
    enabled: true
    path: "/cohort-explorer"
    pathType: "Prefix"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # Runtime config.json – mounted into the nginx container at startup
  config:
    env:
      name: "production"
    api:
      baseUrl: "https://ohs.example.org/num-portal"  # CHANGE_ME: external URL to the backend
    auth:
      baseUrl: "https://ohs.example.org/auth"  # CHANGE_ME: your Keycloak external URL
      realm: "crr"
      clientId: "num-portal-webapp"
    legal:
      copyrightOwner: ""
      imprint: "none"
      imprintUrl: ""
      dataProtection: "none"
      dataProtectionUrl: ""
      contact: "url"
      contactUrl: "https://example.com"  # CHANGE_ME
    welcomePageTitle:
      de: ""
      en: ""

# ========== KEYCLOAK ==========
# Identity and Access Management for the standard OHS deployment.
# Uses the shared postgres-cluster and imports the `crr` realm on first startup.
# Add to ohs-credentials: keycloak-admin-password, keycloak-db-password

keycloak:
  enabled: true
  replicaCount: 1
  image:
    repository: "quay.io/keycloak/keycloak"
    tag: "24.0"  # PIN_VERSION
    pullPolicy: "IfNotPresent"

  service:
    type: "ClusterIP"
    port: 8080
    targetPort: 8080

  ingress:
    enabled: true
    path: "/auth"
    pathType: "Prefix"

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  config:
    startMode: "start"
    adminUser: "admin"
    adminPassword: "CHANGE_ME"  # overridden by ohs-credentials secret

    database:
      host: "postgres-cluster-rw.ohs.svc.cluster.local"  # CHANGE_ME: update namespace
      port: 5432
      name: "keycloak"
      username: "keycloak"
      password: "CHANGE_ME"  # overridden by ohs-credentials secret

    hostname: "ohs.example.org"   # CHANGE_ME: external hostname without path
    hostnameUrl: "https://ohs.example.org/auth"  # CHANGE_ME: external Keycloak URL
    httpEnabled: true              # set false when terminating TLS directly at Keycloak
    proxyHeaders: "xforwarded"

# ========== OPENEHRTOOL ==========
# openEHRTool-v2: web UI for browsing EHRs, templates, compositions, and running AQL queries.
# Source: https://github.com/crs4/openEHRTool-v2
#
# PRE-REQUISITES – no public container images exist; build and push yourself:
#
#   1. ONE-LINE REQUIRED PATCH to backend before building:
#      In backend-fastapi/app/config.py, change:
#        SECRET_KEY = "The Last of Us"
#      to:
#        SECRET_KEY = os.environ.get("OPENEHRTOOL_SECRET_KEY", "change-me-in-production")
#      (add 'import os' at top of file if not already present)
#
#   2. Build backend:
#        git clone https://github.com/crs4/openEHRTool-v2
#        docker build -t <your-registry>/openehrtool-backend:master ./openEHRTool-v2/backend-fastapi
#        docker push <your-registry>/openehrtool-backend:master
#
#   3. Build frontend (VITE_BACKEND_HOSTNAME is baked in at build time – must match backend ingress host):
#        docker build \
#          --build-arg VITE_BACKEND_HOSTNAME=<backend-ingress-host> \
#          -t <your-registry>/openehrtool-frontend:master \
#          ./openEHRTool-v2/frontend-vue
#        docker push <your-registry>/openehrtool-frontend:master
#
#   4. Add secret to ohs-credentials:
#        openehrtool-jwt-secret  (strong random string, min 32 chars)

# openEHRTool – Redis cache (activity log + artefact ID caching)
openehrtool-redis:
  enabled: true
  replicaCount: 1
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 6379
    targetPort: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  config:
    maxmemory: "64mb"
    maxmemoryPolicy: "allkeys-lru"
    save: ""

# openEHRTool – Backend (FastAPI, port 5000)
openehrtool-backend:
  enabled: true
  replicaCount: 1
  image:
    repository: "localhost:5000/openehrtool-backend"  # built via build-images.sh
    tag: "ohs"
    pullPolicy: "Always"
  service:
    type: "ClusterIP"
    port: 5000
    targetPort: 5000
  ingress:
    # Off by default: with a Gateway API setup the route (prefix /openehrtool-api)
    # lives outside the chart. Set to true only on a
    # cluster that actually runs an Ingress controller.
    enabled: false
    className: ""
    annotations: {}
    # Must match VITE_BACKEND_HOSTNAME used when building the frontend image
    host: "openehrtool"
    path: /
    pathType: "Prefix"
  # Die Startseite aggregiert die AQL-Ergebnisse in Python, Zeile fuer Zeile -
  # bei einem Ergebnislimit von 200.000 ist das die teuerste Arbeit im ganzen
  # Stack, und sie laeuft einkernig. Mit 500m brauchte sie laenger als die
  # 60 Sekunden, nach denen die Oberflaeche neu anfragt: jede Wiederholung legte
  # dieselbe Rechnung obendrauf, sodass nie ein Ergebnis fertig wurde.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  config:
    ehrbaseNodename: "local.ehrbase.org"  # display label; actual URL entered by users at login
    redis:
      hostname: "ohs-openehrtool-redis"
      port: 6379
    jwtSecretKey: "CHANGE_ME"  # overridden by ohs-credentials secret key: openehrtool-jwt-secret

# openEHRTool – Frontend (Vue3/nginx, port 80)
openehrtool-frontend:
  enabled: true
  replicaCount: 1
  image:
    # VITE_BACKEND_HOSTNAME must be set at image build time (see PRE-REQUISITES above).
    # Rebuild the image if the backend ingress hostname changes.
    repository: "localhost:5000/openehrtool-frontend"  # built via build-images.sh
    tag: "ohs"
    pullPolicy: "Always"
  service:
    type: "ClusterIP"
    port: 80
    targetPort: 8080  # built image runs nginx-unprivileged (build-images.sh) listening on 8080
  ingress:
    # Off on the cloud cluster - see the note on openehrtool-backend.ingress.
    # Served at https://<host>/openehrtool/ via the Gateway API.
    enabled: false
    className: ""
    annotations: {}
    host: "openehrtool"
    path: /
    pathType: "Prefix"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ========== NETWORKING & INGRESS ==========

ingress:
  enabled: true
  className: "nginx"  # CHANGE_ME: your ingress controller class (e.g., "traefik", "gce")
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # CHANGE_ME: if using cert-manager
  
  tls:
    enabled: true
    issuer: "letsencrypt-prod"  # CHANGE_ME: let's encrypt issuer name, or "self-signed" for dev
  
  hosts:
    - host: "ohs.example.org"  # CHANGE_ME: your actual domain
      paths:
        - path: "/ehrbase"
          pathType: "Prefix"
          service: "ohs-ehrbase"
          port: 8080
        - path: "/openfhir"
          pathType: "Prefix"
          service: "ohs-openfhir"
          port: 8080
        - path: "/eos"
          pathType: "Prefix"
          service: "ohs-eos"
          port: 8081
        - path: "/auth"
          pathType: "Prefix"
          service: "ohs-keycloak"
          port: 8080
        - path: "/num-portal"
          pathType: "Prefix"
          service: "ohs-cohort-explorer-backend"
          port: 8090
        - path: "/cohort-explorer"
          pathType: "Prefix"
          service: "ohs-cohort-explorer-frontend"
          port: 80

# ========== MONITORING & LOGGING (OPTIONAL) ==========

monitoring:
  enabled: false  # Disable by default; enable if Prometheus is running in cluster
  prometheus:
    servicemonitor:
      enabled: false  # Creates ServiceMonitor CRD for Prometheus Operator
      interval: 30s
      scrapeTimeout: 10s

logging:
  enabled: false  # Disable by default
  # For integration with ELK, Loki, etc., configure here

# ========== NETWORK POLICY & MICROSEGMENTATION ==========

networkPolicy:
  enabled: true  # Enable NetworkPolicy for production
  # Label value of the OHS namespace (kubectl label namespace <ns> name=<value>).
  # Defaults to the release namespace name when empty.
  namespaceLabel: ""
  # Namespace label of your ingress controller (default assumes ingress-nginx).
  ingressControllerNamespace: "ingress-nginx"  # CHANGE_ME if different
  # Namespace des CloudNativePG-Operators. Er sitzt ausserhalb von ohs und faellt
  # damit unter default-deny; ohne die Regel allow-cnpg-operator kann er den
  # Zustand der Datenbank-Pods nicht auslesen und wendet dann keine Aenderungen
  # mehr an - ohne dass irgendetwas einen Fehler meldet.
  cnpgOperatorNamespace: "cnpg-system"
  # HTTP ports the ingress controller is allowed to reach on app pods.
  httpPorts:
    - 8080  # ehrbase / openfhir / keycloak
    - 8081  # eos
    - 8090  # cohort-explorer-backend
    - 80    # cohort-explorer-frontend / openehrtool-frontend

# ========== SECURITY & RBAC ==========

rbac:
  create: true  # Create ServiceAccount, ClusterRole, ClusterRoleBinding
  name: "ohs"

# ========== NAMESPACE ==========

namespace:
  name: "default"  # CHANGE_ME: create and use a dedicated namespace in production
  create: false  # Set to true if you want Helm to create the namespace

